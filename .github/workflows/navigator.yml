name: Navigator regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  navigator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install pypdf==6.21.4
      - name: Verify generated standalone version
        run: |
          npm run build
          git diff --exit-code -- navigator/dist/AstroApex.html
      - name: Check Navigator and PDF behavior
        run: npm test
      - name: Check local AI session boundaries
        run: python -m unittest discover -s tests -p test_navigator_server.py
